<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="counter">
    <h1 class="counter-heading">COUNTER</h1>
    <p id="counterValue" class="count">0</p>
    <div class="btn">
        <button  onclick="onDecrement()" class="count-btn">Decrement</button>
        <button  onclick="onReset()" class="count-btn">Reset</button>
        <button  onclick="onIncrement()" class="count-btn">Increment</button>
    </div>
</div>

    <script src="main.js"></script>
</body>
</html>
